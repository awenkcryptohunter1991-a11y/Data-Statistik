<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik Kepegawaian - BMN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Pengaturan Video Background */
        #video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        /* Overlay gelap agar teks lebih kontras */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Kegelapan 50% */
            z-index: -1;
        }

        /* Membuat card sedikit transparan agar terlihat modern (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="font-sans">

    <!-- Video Source (Menggunakan video stok kota dari Pexels sebagai contoh) -->
    <video autoplay muted loop id="video-bg">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-city-traffic-at-night-1074-large.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Overlay -->
    <div class="overlay"></div>

    <div class="container mx-auto p-6 relative z-10">
        <h1 class="text-3xl font-bold text-white mb-8 drop-shadow-lg">Dashboard Statistik Pemanfaatan BMN</h1>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="glass-card p-6 rounded-xl shadow-lg border-l-4 border-blue-500">
                <p class="text-sm text-gray-500 uppercase font-semibold">Kendaraan Dinas Roda 4</p>
                <p class="text-2xl font-bold text-gray-800">1 unit</p>
            </div>
            <div class="glass-card p-6 rounded-xl shadow-lg border-l-4 border-green-500">
                <p class="text-sm text-gray-500 uppercase font-semibold">Kendaraan Dinas Roda 2</p>
                <p class="text-2xl font-bold text-gray-800">12 unit</p>
            </div>
            <div class="glass-card p-6 rounded-xl shadow-lg border-l-4 border-yellow-500">
                <p class="text-sm text-gray-500 uppercase font-semibold">Rumah Negara</p>
                <p class="text-2xl font-bold text-gray-800">5 unit</p>
            </div>
            <div class="glass-card p-6 rounded-xl shadow-lg border-l-4 border-purple-500">
                <p class="text-sm text-gray-500 uppercase font-semibold">Laptop</p>
                <p class="text-2xl font-bold text-gray-800">26 unit</p>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Bar Chart -->
            <div class="glass-card p-6 rounded-xl shadow-lg">
                <h2 class="text-lg font-semibold text-gray-700 mb-4">Pemanfaatan berdasarkan jabatan</h2>
                <canvas id="deptChart"></canvas>
            </div>

            <!-- Pie Chart -->
            <div class="glass-card p-6 rounded-xl shadow-lg">
                <h2 class="text-lg font-semibold text-gray-700 mb-4">Status Pemanfaatan</h2>
                <div class="max-w-[300px] mx-auto">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Grafik Departemen (Bar Chart)
        const ctxDept = document.getElementById('deptChart').getContext('2d');
        new Chart(ctxDept, {
            type: 'bar',
            data: {
                labels: ['Struktural', 'JFT', 'JFU'],
                datasets: [{
                    label: 'Jumlah Pegawai',
                    data: [120, 45, 60], // Menyesuaikan data agar sesuai jumlah label
                    backgroundColor: 'rgba(59, 130, 246, 0.8)',
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true } }
            }
        });

        // Data Grafik Status (Pie Chart)
        const ctxStatus = document.getElementById('statusChart').getContext('2d');
        new Chart(ctxStatus, {
            type: 'doughnut',
            data: {
                labels: ['TU', 'BKD', 'BKA'],
                datasets: [{
                    data: [10, 15, 10],
                    backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    </script>
</body>
</html>
