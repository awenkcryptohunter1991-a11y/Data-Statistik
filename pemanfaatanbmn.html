<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik Pemanfaatan BMN - Bapas Mataram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; background: #0f172a; }
        
        /* Background & Overlay */
        #image-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.9));
            z-index: -1;
        }

        /* Glassmorphism Card Premium */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-8px);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4), 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .glass-card:active {
            transform: scale(0.95);
            background: rgba(59, 130, 246, 0.2);
        }

        /* Chart Styling */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* Border Indikator Warna */
        .border-glow-blue { border-top: 4px solid #3b82f6; }
        .border-glow-green { border-top: 4px solid #10b981; }
        .border-glow-yellow { border-top: 4px solid #f59e0b; }
        .border-glow-purple { border-top: 4px solid #8b5cf6; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="text-white">

    <img src="backgroundpemanfaatan.jpg" id="image-bg" alt="Background Bapas">
    <div class="overlay"></div>

    <div class="container mx-auto p-6 md:p-12 relative z-10 min-h-screen">
        
        <header class="mb-12 text-center">
            <h1 class="text-4xl md:text-5xl font-black tracking-tighter uppercase italic drop-shadow-2xl">
                Dashboard Statistik <span class="text-blue-500">Pemanfaatan BMN</span>
            </h1>
            <div class="h-1 w-32 bg-blue-500 mx-auto mt-4 rounded-full"></div>
            <p class="text-gray-400 mt-4 text-lg">Update data aset secara real-time dan transparan</p>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            
            <div class="glass-card border-glow-blue p-6 rounded-2xl cursor-pointer flex flex-col items-center justify-center group" onclick="window.location.href='kendaraandinasroda4.html'">
                <span class="text-xs text-blue-400 uppercase font-bold tracking-widest mb-2 group-hover:text-blue-300">Roda 4</span>
                <div class="flex items-baseline">
                    <span class="text-6xl font-black italic">1</span>
                    <span class="ml-2 text-sm font-medium opacity-60">UNIT</span>
                </div>
            </div>

            <div class="glass-card border-glow-green p-6 rounded-2xl cursor-pointer flex flex-col items-center justify-center group" onclick="window.location.href='kendaraandinasroda2.html'">
                <span class="text-xs text-green-400 uppercase font-bold tracking-widest mb-2 group-hover:text-green-300">Roda 2</span>
                <div class="flex items-baseline">
                    <span class="text-6xl font-black italic">12</span>
                    <span class="ml-2 text-sm font-medium opacity-60">UNIT</span>
                </div>
            </div>

            <div class="glass-card border-glow-yellow p-6 rounded-2xl cursor-pointer flex flex-col items-center justify-center group" onclick="window.location.href='rumahnegara.html'">
                <span class="text-xs text-yellow-400 uppercase font-bold tracking-widest mb-2 group-hover:text-yellow-300">Rumah Negara</span>
                <div class="flex items-baseline">
                    <span class="text-6xl font-black italic">5</span>
                    <span class="ml-2 text-sm font-medium opacity-60">UNIT</span>
                </div>
            </div>

            <div class="glass-card border-glow-purple p-6 rounded-2xl cursor-pointer flex flex-col items-center justify-center group" onclick="window.location.href='laptop.html'">
                <span class="text-xs text-purple-400 uppercase font-bold tracking-widest mb-2 group-hover:text-purple-300">Laptop</span>
                <div class="flex items-baseline">
                    <span class="text-6xl font-black italic">26</span>
                    <span class="ml-2 text-sm font-medium opacity-60">UNIT</span>
                </div>
            </div>

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-16">
            <div class="glass-card p-8 rounded-3xl">
                <h2 class="text-xl font-bold mb-6 italic flex items-center gap-2">
                    <span class="w-2 h-8 bg-blue-500 rounded-full"></span>
                    Pemanfaatan Berdasarkan Jabatan
                </h2>
                <div class="chart-container">
                    <canvas id="deptChart"></canvas>
                </div>
            </div>

            <div class="glass-card p-8 rounded-3xl">
                <h2 class="text-xl font-bold mb-6 italic flex items-center gap-2">
                    <span class="w-2 h-8 bg-green-500 rounded-full"></span>
                    Status Eselon IV
                </h2>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>

        <footer class="pb-12 flex justify-center">
            <button onclick="window.history.back()" class="glass-card px-8 py-3 rounded-full font-bold flex items-center gap-3 hover:bg-white hover:text-black transition-all uppercase tracking-widest text-xs">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Kembali ke Beranda
            </button>
        </footer>
    </div>

    <script>
        Chart.defaults.color = 'rgba(255,255,255,0.7)';
        Chart.defaults.font.family = "'Inter', sans-serif";

        // Chart 1
        const ctxDept = document.getElementById('deptChart').getContext('2d');
        const gradBlue = ctxDept.createLinearGradient(0, 0, 0, 300);
        gradBlue.addColorStop(0, '#3b82f6');
        gradBlue.addColorStop(1, 'rgba(59, 130, 246, 0.1)');

        new Chart(ctxDept, {
            type: 'bar',
            data: {
                labels: ['Struktural', 'JFT', 'JFU'],
                datasets: [{
                    data: [8, 21, 1],
                    backgroundColor: gradBlue,
                    borderRadius: 8,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true },
                    x: { grid: { display: false } }
                }
            }
        });

        // Chart 2
        const ctxStatus = document.getElementById('statusChart').getContext('2d');
        new Chart(ctxStatus, {
            type: 'doughnut',
            data: {
                labels: ['TU', 'BKD', 'BKA'],
                datasets: [{
                    data: [9, 10, 8],
                    backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                    hoverOffset: 15,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '75%',
                plugins: { legend: { position: 'bottom', labels: { padding: 20 } } }
            }
        });
    </script>
</body>
</html>
