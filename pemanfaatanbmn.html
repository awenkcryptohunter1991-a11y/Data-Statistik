<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik Kepegawaian - BMN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Google untuk tampilan lebih profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        #video-bg {
            position: fixed;
            right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
            z-index: -1;
        }

        /* Glassmorphism dengan transparansi lebih halus */
        .glass-card {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.15) !important;
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Chart container styling */
        .chart-container {
            position: relative;
            margin: auto;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body class="text-white">

    <video autoplay muted loop playsinline id="video-bg">
        <source src="gedungbangunan.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="container mx-auto p-6 md:p-10 relative z-10 min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="mb-12 text-center md:text-left">
            <h1 class="text-4xl font-bold drop-shadow-lg tracking-tight uppercase italic">
                Dashboard Statistik <span class="text-blue-400">Pemanfaatan BMN</span>
            </h1>
            <p class="text-gray-300 mt-2">Update data aset secara real-time dan transparan.</p>
        </header>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <!-- Card -->
            <div class="glass-card p-8 rounded-3xl shadow-2xl border-l-8 border-blue-500 cursor-pointer flex flex-col justify-center items-center" onclick="window.location.href='kendaraandinasroda4.html'">
                <span class="text-xs text-blue-300 uppercase font-bold tracking-widest mb-2">Roda 4</span>
                <div class="flex items-baseline">
                    <span class="text-5xl font-extrabold italic">1</span>
                    <span class="ml-2 text-sm font-light opacity-80">Unit</span>
                </div>
            </div>

            <div class="glass-card p-8 rounded-3xl shadow-2xl border-l-8 border-green-500 cursor-pointer flex flex-col justify-center items-center" onclick="window.location.href='kendaraandinasroda2.html'">
                <span class="text-xs text-green-300 uppercase font-bold tracking-widest mb-2">Roda 2</span>
                <div class="flex items-baseline">
                    <span class="text-5xl font-extrabold italic">12</span>
                    <span class="ml-2 text-sm font-light opacity-80">Unit</span>
                </div>
            </div>

            <div class="glass-card p-8 rounded-3xl shadow-2xl border-l-8 border-yellow-500 cursor-pointer flex flex-col justify-center items-center" onclick="window.location.href='rumahnegara.html'">
                <span class="text-xs text-yellow-300 uppercase font-bold tracking-widest mb-2">Rumah Negara</span>
                <div class="flex items-baseline">
                    <span class="text-5xl font-extrabold italic">5</span>
                    <span class="ml-2 text-sm font-light opacity-80">Unit</span>
                </div>
            </div>

            <div class="glass-card p-8 rounded-3xl shadow-2xl border-l-8 border-purple-500 cursor-pointer flex flex-col justify-center items-center" onclick="window.location.href='laptop.html'">
                <span class="text-xs text-purple-300 uppercase font-bold tracking-widest mb-2">Laptop</span>
                <div class="flex items-baseline">
                    <span class="text-5xl font-extrabold italic">26</span>
                    <span class="ml-2 text-sm font-light opacity-80">Unit</span>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-16">
            <!-- Bar Chart -->
            <div class="glass-card p-8 rounded-3xl shadow-2xl">
                <h2 class="text-xl font-bold mb-6 italic border-b border-white/20 pb-2">Pemanfaatan Berdasarkan Jabatan</h2>
                <div class="chart-container">
                    <canvas id="deptChart"></canvas>
                </div>
            </div>

            <!-- Doughnut Chart -->
            <div class="glass-card p-8 rounded-3xl shadow-2xl">
                <h2 class="text-xl font-bold mb-6 italic border-b border-white/20 pb-2">Status Eselon IV</h2>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Footer / Back Button -->
        <footer class="mt-auto flex justify-center pb-10">
            <button onclick="window.history.back()" class="glass-card px-10 py-4 rounded-full font-bold flex items-center gap-3 hover:bg-white hover:text-black transition-all border border-white/30 uppercase tracking-widest text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Kembali ke Beranda
            </button>
        </footer>
    </div>

    <script>
        // Set Default Chart Colors
        Chart.defaults.color = '#fff';
        Chart.defaults.font.family = "'Inter', sans-serif";

        // Grafik Departemen (Bar Chart)
        const ctxDept = document.getElementById('deptChart').getContext('2d');
        // Membuat gradient untuk bar agar terlihat lebih modern
        const gradientBlue = ctxDept.createLinearGradient(0, 0, 0, 400);
        gradientBlue.addColorStop(0, 'rgba(59, 130, 246, 1)');
        gradientBlue.addColorStop(1, 'rgba(30, 58, 138, 0.4)');

        new Chart(ctxDept, {
            type: 'bar',
            data: {
                labels: ['Struktural', 'JFT', 'JFU'],
                datasets: [{
                    label: 'Jumlah Pegawai',
                    data: [120, 45, 60],
                    backgroundColor: gradientBlue,
                    borderColor: '#3b82f6',
                    borderWidth: 2,
                    borderRadius: 15,
                    hoverBackgroundColor: '#60a5fa'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.1)' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });

        // Grafik Status (Doughnut Chart)
        const ctxStatus = document.getElementById('statusChart').getContext('2d');
        new Chart(ctxStatus, {
            type: 'doughnut',
            data: {
                labels: ['TU', 'BKD', 'BKA'],
                datasets: [{
                    data: [10, 15, 10],
                    backgroundColor: [
                        'rgba(16, 185, 129, 0.8)', // Green
                        'rgba(245, 158, 11, 0.8)', // Orange
                        'rgba(239, 68, 68, 0.8)'   // Red
                    ],
                    borderColor: 'rgba(255, 255, 255, 0.2)',
                    borderWidth: 2,
                    hoverOffset: 20
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    </script>
</body>
</html>
