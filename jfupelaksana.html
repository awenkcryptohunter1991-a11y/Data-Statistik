<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pegawai - Live Sync</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body { 
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;

            /* KODE UNTUK BACKGROUND FOTO */
            /* Angka 0.8 di bawah adalah tingkat kegelapan (overlay). 
               Semakin besar angkanya, semakin gelap fotonya agar teks jelas. */
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                              url('backgroundstruktural.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Background tidak ikut bergeser saat di-scroll */
            background-repeat: no-repeat;
        }

        h1 {
            text-align: center;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 40px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; 
            max-width: 1200px;
            margin: 0 auto;
            flex-grow: 1; /* Membuat container mengambil ruang yang tersedia */
        }

        /* Desain Kartu */
        .card { 
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            padding: 30px; 
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .name { 
            font-weight: 700; 
            font-size: 1.25rem; 
            margin-bottom: 8px;
            color: #fff;
        }

        .nip-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Monaco', monospace;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .info-group {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .label { 
            font-size: 0.65rem; 
            color: var(--text-secondary);
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .value { 
            font-size: 0.95rem; 
            color: #cbd5e1;
            line-height: 1.4;
        }

        /* Navigasi Bawah (Footer) */
        .footer-nav {
            text-align: center;
            margin-top: 50px;
            padding: 20px 0;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-back:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        }

        .btn-back svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .btn-back:hover svg {
            transform: translateX(-5px);
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 100px;
            font-size: 1.2rem;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <h1>DAFTAR PEGAWAI JFU</h1>

    <div id="team-container" class="container">
        <div class="loading">Tunggu yaa pak statistisinya sedang menarik data dari google drive...</div>
    </div>

    <div class="footer-nav">
        <button onclick="window.history.back()" class="btn-back">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            Kembali ke Halaman Sebelumnya
        </button>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQPqErr-dIdGJSilNlbySIySwKf8xofAA00-hL0I-fzfiBYbykYituGq7MSNYdva-fAUGlWSVvGU4zp/pub?output=csv';

        async function fetchData() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                
                const rows = csvData.split('\n').filter(row => row.trim() !== '');
                const dataRows = rows.slice(1); 
                
                const container = document.getElementById('team-container');
                container.innerHTML = ''; 

                dataRows.forEach(row => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (columns.length >= 4) {
                        const name = columns[0].replace(/"/g, '');
                        const nip = columns[1].replace(/"/g, '');
                        const jabatan = columns[2].replace(/"/g, '');
                        const pangkat = columns[3].replace(/"/g, '');

                        const card = `
                            <div class="card">
                                <div class="name">${name}</div>
                                <div class="nip-badge">NIP. ${nip}</div>
                                <div class="info-group">
                                    <div class="label">Jabatan</div>
                                    <div class="value">${jabatan}</div>
                                    <div class="value" style="color:#64748b; font-size: 0.8rem; margin-top:5px;">${pangkat}</div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    }
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
