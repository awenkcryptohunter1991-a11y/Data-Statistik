<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kepala Bapas Mataram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- KODE UNTUK BACKGROUND FOTO --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* GANTI 'backgroundkabapas.png' dengan nama file foto Anda */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('backgroundkabapas.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .profile-card {
            background-color: rgba(38, 38, 38, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            transition: transform 0.3s ease;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-card:hover {
            transform: translateY(-10px);
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid rgba(243, 244, 246, 0.8);
            margin-top: -75px;
            background-color: #d1d5db;
        }

        .btn-back {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back:hover {
            background-color: white;
            color: #262626;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="p-10">

    <div class="container mx-auto content-wrapper">
        <h1 class="text-4xl font-bold text-center mb-24 text-white uppercase tracking-tight drop-shadow-lg">
            Kepala Bapas Kelas I Mataram
        </h1>
        
        <div id="profile-grid" class="flex justify-center items-center flex-grow">
            </div>

        <div class="flex justify-center mt-16 mb-10">
            <a href="javascript:history.back()" class="btn-back shadow-xl">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>
    </div>

    <script>
        const teamData = [
            { 
                name: "ARIMIN, Bc.IP., S.Pd.", 
                img: "Kabapass.png",
                nip: "196912311993031001",
                jabatan: "Kepala Bapas Kelas I Mataram",
                pangkat: "Pembina Tk.I (IV/b)"
            }
        ];

        const grid = document.getElementById('profile-grid');

        teamData.forEach(person => {
            grid.innerHTML += `
                <div class="profile-card flex flex-col items-center p-10 text-center shadow-2xl mt-10">
                    <img src="${person.img}" alt="${person.name}" class="profile-image shadow-lg">
                    
                    <h2 class="text-white font-extrabold text-2xl mt-6 mb-8 tracking-widest leading-tight">
                        ${person.name}
                    </h2>
                    
                    <div class="text-gray-300 text-sm italic leading-relaxed relative px-6">
                        <span class="text-3xl font-serif absolute -left-2 -top-4 text-gray-500 opacity-50">"</span>
                        <p class="mb-1">NIP : ${person.nip}</p>
                        <p class="mb-1">
                            <span>Jabatan : </span>
                            <span class="font-bold text-white">${person.jabatan}</span>
                        </p>
                        <p>Pangkat : ${person.pangkat}.</p>
                        <span class="text-3xl font-serif absolute -right-2 -bottom-4 text-gray-500 opacity-50">"</span>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
